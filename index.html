<style>

[data-theme="plain"]{

  --card:#FFFFFF; --surface:#F4F4F4; --chip:#ECECEC;

}
[data-theme="plain"] *{ box-shadow:none !important; }
  /* Calmer reading defaults: bigger base type, generous line height,
     nothing centred or justified, no motion unless the OS allows it. */
  html { font-size:17px; }
  body { line-height:1.65; letter-spacing:0.005em; }
  p, span, label, li { text-align:left; }
  button { min-height:44px; text-align:left; }
  button.icon-only { min-height:0; }
  .text-xs { font-size:0.82rem !important; line-height:1.6 !important; }
  .text-sm { font-size:0.94rem !important; line-height:1.6 !important; }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
  html, body { margin:0; padding:0; background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%); transition:background .2s ease; color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; cursor:pointer; border:none; transition: transform .12s ease, box-shadow .15s ease, opacity .15s ease, background .15s ease; background:none; }
  button:active:not(:disabled) { transform: scale(0.96); }
  button:disabled { opacity:0.4; cursor:default; }
  input, select { font-family:inherit; transition: box-shadow .15s ease, border-color .15s ease; }
  input:focus, select:focus { outline:none; box-shadow:0 0 0 3px rgba(59,75,107,0.15); border-color:var(--accent) !important; }
  @keyframes fadeSlideUp { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .fade-in { animation: fadeSlideUp .28s ease both; }
  @keyframes modalUp { from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);} }
  .modal-up { animation: modalUp .22s cubic-bezier(.16,1,.3,1) both; }
  ::-webkit-scrollbar { width:0; height:0; }

<div id="app"></div>

<script>
/* =========================== constants & tokens ===========================
  bg gradient sage/paper | card var(--card) | ink var(--text) | soft var(--muted) | line var(--border)
  accent var(--accent) | ok var(--ok) | warn var(--warn) | over var(--over) | gold var(--highlight)
============================================================================ */
const DAY_LABELS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const CLASS_COLORS = ["var(--accent)","var(--ok)","var(--warn)","var(--over)","var(--cat1)","var(--cat2)"];
const SCHOOL_PRESETS = [
  { name: "Dallas College – North Lake Campus", domains: ["student.dcccd.edu","student.dallascollege.edu"] },
  { name: "Lone Star Test University (fake — for testing)", domains: ["student.lonestartest.edu"] },
];
// Set this to your real Blue Bonnet API endpoint. Left empty, the chat explains it isn't wired up yet.
const BLUE_BONNET_ENDPOINT = "";
// Fill in your own OAuth Client ID from Google Cloud Console to enable Drive sync.
// Authorized JavaScript origin must exactly match your GitHub Pages URL (e.g. https://yourname.github.io).
const GOOGLE_CLIENT_ID = "607694277453-t96d8mtknt9ceme8999dts6src0fre5l.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
// app.created = this app can only see and edit calendars it made itself.
// It cannot read, write to, or interfere with any other calendar on the account.
const CALENDAR_SCOPE = "https://www.googleapis.com/auth/calendar.app.created";
const COLLEGE_CAL_NAME = "College";
const CAL_TZ = "America/Chicago";
const DRIVE_DATA_FILENAME = "campus-data.json";
const DRIVE_PROGRESS_FILENAME = "campus-progress.json";

const inputStyle = "border:1px solid var(--border);background:white;width:100%;";

function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shortClassName(name){
  if(!name) return "";
  return name.replace(/\s*\([^)]*\)\s*$/,"").trim() || name;
}
function courseCodeOf(name){
  const m=(name||"").match(/\(([^)]*)\)\s*$/);
  return m?m[1].trim():"";
}
// Strip a leading course code from an assignment title: "LGLA 1301.5: Wk1: x" -> "Wk1: x"
function cleanAssignmentTitle(title){
  return (title||"").replace(/^\s*[A-Z]{2,5}\s*\d{3,4}(?:\.\d+)?\s*:\s*/,"").trim() || title;
}
// Which class does this assignment belong to?
function classOfAssignment(a){
  if(a.classId){ const c=state.classes.find(c=>c.id===a.classId); if(c) return c; }
  const t=(a.title||"");
  return state.classes.find(c=>{
    const code=courseCodeOf(c.name);
    return (code && t.indexOf(code)!==-1) || t.indexOf(shortClassName(c.name))!==-1;
  }) || null;
}
function classChecklistKey(name){ return `checklist-${name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,80)}`; }
function schoolChecklistKey(school){ return `student-checklist-${school.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,80)}`; }
function isAllowedEmail(email, school){
  const domain = (email.split("@")[1]||"").trim().toLowerCase();
  if(!domain) return false;
  const preset = SCHOOL_PRESETS.find(s=>s.name.toLowerCase()===school.trim().toLowerCase());
  if(preset) return preset.domains.some(d=>domain===d);
  return domain.endsWith(".edu");
}
function parseTime(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function fmtTime(hhmm){
  const mins=parseTime(hhmm); const h24=Math.floor(mins/60), m=mins%60;
  const ampm=h24>=12?"PM":"AM"; const h12=h24%12===0?12:h24%12;
  return `${h12}:${String(m).padStart(2,"0")} ${ampm}`;
}
function fmtMoney(n){ return `$${Math.abs(n).toFixed(2)}`; }
function daysUntil(dateStr){
  const now=new Date(); now.setHours(0,0,0,0);
  const d=new Date(dateStr); d.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
function nextRenewalDate(sub){
  const cadenceDays = sub.cadence==="weekly"?7:sub.cadence==="yearly"?365:30;
  let d=new Date(sub.renewsOn); const now=new Date();
  while(d<now) d.setDate(d.getDate()+cadenceDays);
  return d;
}
function monthlyCost(sub){
  if(sub.cadence==="weekly") return sub.amount*4.33;
  if(sub.cadence==="yearly") return sub.amount/12;
  return sub.amount;
}
function computeSemesterPace(semester, budgetTx){
  const start=new Date(semester.startDate), end=new Date(semester.endDate), now=new Date();
  const totalDays=Math.max(1,(end-start)/86400000);
  const elapsedDays=Math.min(totalDays, Math.max(0,(now-start)/86400000));
  const spent=budgetTx.filter(t=>new Date(t.date)>=start).reduce((s,t)=>s+t.amount,0);
  const remaining=semester.total-spent;
  const expectedRemaining=semester.total*(1-elapsedDays/totalDays);
  const weeklyAllowance=semester.total/(totalDays/7);
  let status="ok";
  if(remaining<expectedRemaining*0.75) status="over";
  else if(remaining<expectedRemaining*0.9) status="warn";
  return {remaining, expectedRemaining, weeklyAllowance, status, spent, totalDays, elapsedDays};
}
function startOfWeek(d){ const date=new Date(d); const day=date.getDay(); date.setDate(date.getDate()+(day===0?-6:1-day)); date.setHours(0,0,0,0); return date; }
function endOfWeek(d){ const s=startOfWeek(d); const e=new Date(s); e.setDate(e.getDate()+6); e.setHours(23,59,59,999); return e; }
const MAP_FT_W=2200, MAP_FT_H=1400, WALK_FT_PER_MIN=250;
function walkMinutes(pinA,pinB){
  if(!pinA||!pinB) return null;
  const dx=((pinA.x-pinB.x)/100)*MAP_FT_W, dy=((pinA.y-pinB.y)/100)*MAP_FT_H;
  return Math.max(1, Math.ceil(Math.sqrt(dx*dx+dy*dy)/WALK_FT_PER_MIN));
}
function statusFor(pct){ if(pct>=100) return "over"; if(pct>=75) return "warn"; return "ok"; }
const STATUS_COLOR={ok:"var(--ok)",warn:"var(--warn)",over:"var(--over)"};
const STATUS_LABEL={ok:"On track",warn:"Near limit",over:"Past the limit"};
const LEVEL_COLOR={info:"var(--accent)",warn:"var(--warn)",over:"var(--over)"};
const LEVEL_ICON={info:"clock",warn:"footprints",over:"alert-triangle"};

/* =============================== storage =============================== */
const LS = {
  get(key, fallback){ try{ const v=localStorage.getItem(key); if(v===null) return fallback; const p=JSON.parse(v); return (p===null||p===undefined)?fallback:p; }catch(e){ return fallback; } },
  set(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); return true; }catch(e){ return false; } },
};

/* ================================ state ================================= */
const DEFAULT_ENROLL_STEPS = [
  "Submit your admissions application",
  "Request your official high school transcript or GED sent to the school",
  "Complete the FAFSA (or your state/school financial aid form)",
  "Take your placement assessment or submit SAT/ACT/TSI scores",
  "Apply for scholarships you may qualify for",
  "Meet with an academic advisor to plan your first semester",
  "Register for new-student orientation",
  "Submit immunization records (if your school requires them)",
  "Set up your school email and student portal login",
  "Register for classes",
  "Pay your tuition deposit or set up a payment plan",
  "Order your student ID and check on-campus housing/parking if needed",
];
const DEFAULT_BUDGET_CATS = [
  { id: uid(), name:"Dining Out", weeklyLimit:40, discretionary:true },
  { id: uid(), name:"Coffee", weeklyLimit:15, discretionary:true },
  { id: uid(), name:"Textbooks & Supplies", weeklyLimit:30, discretionary:false },
];

let state = {
  enrollment: LS.get("campus-enrollment", null),
  profile: LS.get("campus-profile", { name:"", school:"", studentId:"", photo:"", verified:false }),
  classes: LS.get("campus-classes", []),
  pins: LS.get("campus-pins", []),
  events: LS.get("campus-events", []),
  budgetCats: LS.get("campus-budget-cats", DEFAULT_BUDGET_CATS),
  budgetTx: LS.get("campus-budget-tx", []),
  semester: LS.get("campus-semester", null),
  subscriptions: LS.get("campus-subscriptions", []),
  splits: LS.get("campus-splits", []),
  importantDates: LS.get("campus-dates", []),
  assignments: LS.get("campus-assignments", []),
  asyncCourses: LS.get("campus-async-courses", []),
  enrollChecklist: LS.get("campus-enrollment-checklist", DEFAULT_ENROLL_STEPS.map(text=>({id:uid(), text, done:false}))),
  alerts: LS.get("campus-alerts", []),
  theme: LS.get("campus-theme", "warm"),
  openAssignGroup: null,
  legendOpen: false,
  dfwOpen: false,
  openClassCard: null,
  classShowAll: {},
  calPushing: false,
  calError: "",
  calSummary: "",
  calLastPush: LS.get("campus-calendar-last-push", null),
  expandedGroups: {},
  safetyInfo: LS.get("campus-safety-info", { safetyNumber:"", escortNumber:"" }),
  supportInfo: LS.get("campus-support-info", { center:"", number:"" }),
  // ephemeral UI state (not persisted)
  tab: "today",
  dismissed: [],
  scheduleDay: (new Date().getDay()===0?1:new Date().getDay()),
  openChecklist: null,
  expandedBudgetCat: null,
  mapAddMode: false,
  pendingPin: null,
  modal: null, // {type, ...}
  bbMessages: [{role:"assistant", content:"Hi, I'm Blue Bonnet. Ask me about your classes, budget, or what's due soon."}],
  bbLoading: false,
  bbError: "",
  bbDragOver: false,
  bbFileProcessing: false,
  bbFileError: "",
  bbPendingClasses: null, // array of {name,days,start,end,location,include} awaiting confirmation
  safetyOpen: false, safetyEditing: false,
  supportOpen: false, supportEditing: false,
  enrollChecklistOpen: null,
  driveConnected: false,
  driveConnecting: false,
  driveLastSynced: LS.get("campus-drive-last-synced", null),
  driveError: "",
};

/* ============================ Google Drive sync =========================== */
let driveAccessToken = null;
let driveTokenClient = null;
let driveDataFileId = LS.get("campus-drive-data-fileid", null);
let driveProgressFileId = LS.get("campus-drive-progress-fileid", null);
let driveSaveTimer = null;

const DRIVE_DATA_KEYS = [
  "campus-enrollment","campus-profile","campus-classes","campus-pins","campus-events",
  "campus-budget-cats","campus-budget-tx","campus-semester","campus-subscriptions",
  "campus-splits","campus-dates","campus-assignments","campus-enrollment-checklist",
  "campus-alerts","campus-safety-info","campus-support-info","campus-async-courses",
  "campus-syllabus-import-done","campus-theme",
];
function isChecklistKey(k){ return !!k && (k.indexOf("checklist-")===0 || k.indexOf("student-checklist-")===0); }
function driveSyncKeys(){
  const keys=[...DRIVE_DATA_KEYS];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(isChecklistKey(k) && keys.indexOf(k)===-1) keys.push(k);
  }
  return keys;
}

function driveReady(){ return !!(GOOGLE_CLIENT_ID && window.google && window.google.accounts && window.google.accounts.oauth2); }

function initGoogleClient(){
  if(!GOOGLE_CLIENT_ID) return;
  const tryInit=()=>{
    if(!driveReady()){ setTimeout(tryInit, 300); return; }
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE + " " + CALENDAR_SCOPE,
      callback: onDriveToken,
    });
    // attempt a silent restore if we've connected before
    if(LS.get("campus-drive-was-connected", false)){
      try{ driveTokenClient.requestAccessToken({ prompt: "" }); }catch(e){}
    }
  };
  tryInit();
}
function connectDrive(){
  state.driveError="";
  if(!GOOGLE_CLIENT_ID){ state.driveError="Google Drive isn't configured yet — add a GOOGLE_CLIENT_ID near the top of the script."; render(); return; }
  if(!driveTokenClient){ state.driveError="Still loading Google's sign-in — try again in a second."; render(); return; }
  state.driveConnecting=true; render();
  driveTokenClient.requestAccessToken({ prompt: "consent" });
}
async function onDriveToken(resp){
  state.driveConnecting=false;
  if(resp.error){ state.driveError="Google Drive sign-in didn't complete — try again."; render(); return; }
  driveAccessToken = resp.access_token;
  state.driveConnected=true;
  LS.set("campus-drive-was-connected", true);
  state.driveError="";
  await loadFromDrive();
  render();
}
async function driveApi(url, options){
  options=options||{};
  options.headers = { ...(options.headers||{}), Authorization: `Bearer ${driveAccessToken}` };
  const res = await fetch(url, options);
  if(res.status===401){ state.driveConnected=false; driveAccessToken=null; throw new Error("Drive session expired — reconnect."); }
  return res;
}
async function driveFindOrCreateFile(filename, cachedId, setCachedId){
  if(cachedId){
    const check = await driveApi(`https://www.googleapis.com/drive/v3/files/${cachedId}?fields=id,trashed`);
    if(check.ok){ const meta=await check.json(); if(!meta.trashed) return cachedId; }
  }
  const search = await driveApi(`https://www.googleapis.com/drive/v3/files?q=name='${filename}'+and+trashed=false&spaces=drive&fields=files(id,name)`);
  const searchData = await search.json();
  if(searchData.files && searchData.files.length){ setCachedId(searchData.files[0].id); return searchData.files[0].id; }
  const createRes = await driveApi("https://www.googleapis.com/drive/v3/files", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ name: filename, mimeType:"application/json" }),
  });
  const created = await createRes.json();
  setCachedId(created.id);
  return created.id;
}
async function loadFromDrive(){
  if(!driveAccessToken) return;
  try{
    const id = await driveFindOrCreateFile(DRIVE_DATA_FILENAME, driveDataFileId, (fid)=>{ driveDataFileId=fid; LS.set("campus-drive-data-fileid", fid); });
    const res = await driveApi(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
    const text = await res.text();
    if(text && text.trim()){
      const remote = JSON.parse(text);
      Object.keys(remote).forEach(key=>{
        const val=remote[key];
        if(val===null||val===undefined) return;
        if(DRIVE_DATA_KEYS.indexOf(key)!==-1 || isChecklistKey(key)){
          LS.set(key, val);
          const stateKey = driveKeyToStateKey(key);
          if(stateKey) state[stateKey]=val;
        }
      });
    }
    state.driveLastSynced=new Date().toISOString();
    LS.set("campus-drive-last-synced", state.driveLastSynced);
  }catch(e){
    state.driveError="Couldn't load your saved data from Drive — using what's on this device instead.";
  }
  render();
}
function driveKeyToStateKey(lsKey){
  const map={
    "campus-enrollment":"enrollment","campus-profile":"profile","campus-classes":"classes","campus-pins":"pins",
    "campus-events":"events","campus-budget-cats":"budgetCats","campus-budget-tx":"budgetTx","campus-semester":"semester",
    "campus-subscriptions":"subscriptions","campus-splits":"splits","campus-dates":"importantDates","campus-assignments":"assignments",
    "campus-enrollment-checklist":"enrollChecklist","campus-alerts":"alerts","campus-safety-info":"safetyInfo","campus-support-info":"supportInfo",
    "campus-async-courses":"asyncCourses","campus-theme":"theme",
  };
  return map[lsKey];
}
function buildProgressSummary(){
  const done=state.enrollChecklist.filter(i=>i.done).length;
  const discCats=state.budgetCats.filter(c=>c.discretionary);
  const discSpent=discCats.reduce((s,c)=>s+spentFor(c.id),0);
  const discLimit=discCats.reduce((s,c)=>s+c.weeklyLimit,0);
  const pace=state.semester?computeSemesterPace(state.semester, state.budgetTx):null;
  return {
    lastUpdated: new Date().toISOString(),
    school: state.enrollment?.school||null,
    enrollmentStatus: isVerified()?"verified":"pending",
    enrollmentChecklist: { done, total: state.enrollChecklist.length, percent: state.enrollChecklist.length?Math.round(done/state.enrollChecklist.length*100):0 },
    discretionarySpendThisWeek: { spent: Math.round(discSpent*100)/100, limit: Math.round(discLimit*100)/100 },
    semesterPace: pace ? { remaining: Math.round(pace.remaining*100)/100, weeklyAllowance: Math.round(pace.weeklyAllowance*100)/100, status: pace.status } : null,
    assignmentsDueSoon: state.assignments.filter(a=>!a.done && daysUntil(a.dueDate)>=0 && daysUntil(a.dueDate)<=5).length,
  };
}
function scheduleDriveSave(){
  if(!state.driveConnected || !driveAccessToken) return;
  clearTimeout(driveSaveTimer);
  driveSaveTimer=setTimeout(saveToDrive, 1500);
}
async function saveToDrive(){
  if(!driveAccessToken) return;
  try{
    const dataId = await driveFindOrCreateFile(DRIVE_DATA_FILENAME, driveDataFileId, (fid)=>{ driveDataFileId=fid; LS.set("campus-drive-data-fileid", fid); });
    const payload={};
    driveSyncKeys().forEach(key=>{ const v=LS.get(key, undefined); if(v!==undefined && v!==null) payload[key]=v; });
    await driveApi(`https://www.googleapis.com/upload/drive/v3/files/${dataId}?uploadType=media`, {
      method:"PATCH", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload),
    });
    const progressId = await driveFindOrCreateFile(DRIVE_PROGRESS_FILENAME, driveProgressFileId, (fid)=>{ driveProgressFileId=fid; LS.set("campus-drive-progress-fileid", fid); });
    await driveApi(`https://www.googleapis.com/upload/drive/v3/files/${progressId}?uploadType=media`, {
      method:"PATCH", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(buildProgressSummary()),
    });
    state.driveLastSynced=new Date().toISOString();
    LS.set("campus-drive-last-synced", state.driveLastSynced);
    state.driveError="";
  }catch(e){
    state.driveError="Last save to Drive didn't go through — your data is still safe on this device.";
  }
  render();

/* ============================ alert engine =============================== */
const alertedKeys = new Set();
let alertsChanged=false;
function pushAlert(key, message, level){
  if(alertedKeys.has(key)) return;
  alertedKeys.add(key);
  alertsChanged=true;
  state.alerts = [{id:uid(), message, level, timestamp:new Date().toISOString()}, ...state.alerts].slice(0,60);
  persist("campus-alerts", state.alerts);
}
function spentFor(catId){
  const ws=startOfWeek(new Date()), we=endOfWeek(new Date());
  return state.budgetTx.filter(t=>t.categoryId===catId).filter(t=>{const d=new Date(t.date); return d>=ws && d<=we;}).reduce((s,t)=>s+t.amount,0);
}
function runChecks(){
  const now=new Date(), todayStr=now.toDateString(), dayIdx=now.getDay();
  const nowMin=now.getHours()*60+now.getMinutes();
  const todays=state.classes.filter(c=>c.days.includes(dayIdx)).sort((a,b)=>parseTime(a.start)-parseTime(b.start));
  todays.forEach(c=>{
    const startMin=parseTime(c.start);
    if(nowMin>=startMin-15 && nowMin<startMin){
      pushAlert(`class-${c.id}-${todayStr}`, `${c.name} starts in ${startMin-nowMin} min${c.location?` at ${c.location}`:""}.`, "info");
    }
  });
  for(let i=0;i<todays.length-1;i++){
    const a=todays[i], b=todays[i+1];
    const gap=parseTime(b.start)-parseTime(a.end);
    const pinA=state.pins.find(p=>p.id===a.pinId), pinB=state.pins.find(p=>p.id===b.pinId);
    const wm=walkMinutes(pinA,pinB);
    if(wm!==null && gap<wm+5){
      pushAlert(`gap-${a.id}-${b.id}-${todayStr}`, `Tight transition: ${a.name} → ${b.name} is a ${wm} min walk but you only have ${gap} min.`, "warn");
    }
  }
  state.events.forEach(ev=>{
    if(!ev.date || !ev.time) return;
    if(new Date(ev.date).toDateString()!==todayStr) return;
    const startMin=parseTime(ev.time);
    if(nowMin>=startMin-60 && nowMin<startMin){
      pushAlert(`event-${ev.id}-${todayStr}`, `${ev.title} starts in ${startMin-nowMin} min${ev.location?` at ${ev.location}`:""}.`, "info");
    }
  });
  state.subscriptions.forEach(sub=>{
    const nd=nextRenewalDate(sub), away=daysUntil(nd);
    if(away>=0 && away<=3){
      pushAlert(`sub-${sub.id}-${nd.toDateString()}`, `${sub.name} renews ${away===0?"today":`in ${away} day${away>1?"s":""}`} — ${fmtMoney(sub.amount)}.`, "warn");
    }
  });
  state.importantDates.forEach(d=>{
    const away=daysUntil(d.date);
    if(away>=0 && away<=3){
      pushAlert(`date-${d.id}-${d.date}`, `${d.label} is ${away===0?"today":`in ${away} day${away>1?"s":""}`}.`, away<=1?"over":"warn");
    }
  });
  state.assignments.forEach(a=>{
    if(a.done) return;
    const away=daysUntil(a.dueDate);
    if(away>=0 && away<=2){
      pushAlert(`assign-${a.id}-${a.dueDate}`, `${a.title} is due ${away===0?"today":`in ${away} day${away>1?"s":""}`}.`, away===0?"over":"warn");
    }
  });
  if(alertsChanged){ alertsChanged=false; render(); }
}

/* ============================ Blue Bonnet context ========================= */
function buildBlueBonnetContext(){
  const now=new Date(), dayIdx=now.getDay();
  const todays=state.classes.filter(c=>c.days.includes(dayIdx)).sort((a,b)=>parseTime(a.start)-parseTime(b.start));
  const dueSoon=state.assignments.filter(a=>!a.done && daysUntil(a.dueDate)>=0 && daysUntil(a.dueDate)<=5).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  const todayEvents=state.events.filter(e=>e.date && new Date(e.date).toDateString()===now.toDateString());
  const discCats=state.budgetCats.filter(c=>c.discretionary);
  const discSpent=discCats.reduce((s,c)=>s+spentFor(c.id),0);
  const discLimit=discCats.reduce((s,c)=>s+c.weeklyLimit,0);
  const pace=state.semester?computeSemesterPace(state.semester, state.budgetTx):null;
  const upcomingSubs=state.subscriptions.map(s=>({...s, away:daysUntil(nextRenewalDate(s))})).filter(s=>s.away<=7);
  const lines=[];
  lines.push(`Today is ${now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}.`);
  lines.push(`Student is ${isVerified()?"a verified":"a pending, not-yet-verified"} student at ${state.enrollment?.school||"an unspecified school"}.`);
  lines.push(todays.length?`Today's classes: ${todays.map(c=>`${c.name} ${fmtTime(c.start)}-${fmtTime(c.end)}${c.location?` at ${c.location}`:""}`).join("; ")}.`:"No classes today.");
  lines.push(dueSoon.length?`Assignments due soon: ${dueSoon.map(a=>`${a.title} (due in ${daysUntil(a.dueDate)}d)`).join("; ")}.`:"No assignments due in the next 5 days.");
  lines.push(todayEvents.length?`Events today: ${todayEvents.map(e=>e.title).join(", ")}.`:"No events today.");
  lines.push(`Discretionary spending this week: $${discSpent.toFixed(2)} of $${discLimit.toFixed(2)} budgeted.`);
  if(pace) lines.push(`Semester funds: $${pace.remaining.toFixed(2)} left of $${state.semester.total}, about $${pace.weeklyAllowance.toFixed(2)}/week to stay on pace.`);
  if(upcomingSubs.length) lines.push(`Subscriptions renewing soon: ${upcomingSubs.map(s=>`${s.name} in ${s.away}d ($${s.amount})`).join("; ")}.`);
  return lines.join(" ");
}
async function sendBlueBonnet(){
  const inputEl=document.getElementById("bb-input");
  const text=(inputEl?.value||"").trim();
  if(!text || state.bbLoading) return;
  state.bbMessages=[...state.bbMessages, {role:"user", content:text}];
  state.bbLoading=true; state.bbError="";
  render();
  if(!BLUE_BONNET_ENDPOINT){
    state.bbMessages=[...state.bbMessages, {role:"assistant", content:"Blue Bonnet isn't wired up to a live endpoint yet. Set BLUE_BONNET_ENDPOINT near the top of this file's <script> to your actual Blue Bonnet API URL, and this chat will call it automatically."}];
    state.bbLoading=false; render(); return;
  }
  try{
    const res=await fetch(BLUE_BONNET_ENDPOINT, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ messages: state.bbMessages, context: buildBlueBonnetContext() }),
    });
    const data=await res.json();
    state.bbMessages=[...state.bbMessages, {role:"assistant", content: data.reply || data.content || "Sorry, I didn't catch that."}];
  }catch(err){
    state.bbError="Blue Bonnet couldn't respond right now — try again in a moment.";
  }
  state.bbLoading=false;
  render();
}

  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";

const SYLLABUS_ACCEPTED_TYPES = [
  "application/pdf",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  "text/plain",
  "image/png","image/jpeg","image/webp","image/heic",
];
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result.split(",")[1]);
    r.onerror=()=>reject(new Error("Couldn't read file"));
    r.readAsDataURL(file);
  });
}
async function extractFileContent(file){
  if(file.type==="application/pdf"){
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({ data: buf }).promise;
    let text="";
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const content=await page.getTextContent();
      text += content.items.map(it=>it.str).join(" ") + "\n";
    }
    return { type:"text", content:text };
  }
  if(file.type==="application/vnd.openxmlformats-officedocument.wordprocessingml.document"){
    const buf=await file.arrayBuffer();
    const result=await mammoth.extractRawText({ arrayBuffer: buf });
    return { type:"text", content:result.value };
  }
  if(file.type==="text/plain"){
    return { type:"text", content: await file.text() };
  }
  if(file.type.startsWith("image/")){
    const b64=await fileToBase64(file);
    return { type:"image", content:b64, mimeType:file.type };
  }
  throw new Error("Unsupported file type");
}
async function handleSyllabusFile(file){
  if(!file) return;
  state.bbDragOver=false;
  if(!SYLLABUS_ACCEPTED_TYPES.includes(file.type)){
    state.bbFileError="That file type isn't supported — try a PDF, Word doc, image, or plain text file.";
    render(); return;
  }
  if(!BLUE_BONNET_ENDPOINT){
    state.bbFileError="Blue Bonnet isn't wired up to a live endpoint yet, so it can't read files. Set BLUE_BONNET_ENDPOINT near the top of the script first.";
    render(); return;
  }
  state.bbFileProcessing=true; state.bbFileError=""; state.bbPendingClasses=null;
  state.bbMessages=[...state.bbMessages, {role:"user", content:`📎 ${file.name}`}];
  render();
  try{
    const extracted=await extractFileContent(file);
    const res=await fetch(BLUE_BONNET_ENDPOINT, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        task: "parse_syllabus",
        fileType: extracted.type,
        content: extracted.content,
        mimeType: extracted.mimeType || null,
      }),
    });
    const data=await res.json();
    const classes = Array.isArray(data.classes) ? data.classes : [];
    if(classes.length===0){
      state.bbMessages=[...state.bbMessages, {role:"assistant", content: data.summary || "I couldn't find a clear class schedule in that file — you can still add classes manually on the Schedule tab."}];
    }else{
      state.bbPendingClasses = classes.map(c=>({
        name: c.name||"Untitled class",
        days: Array.isArray(c.days)?c.days:[],
        start: c.start||"09:00",
        end: c.end||"10:00",
        location: c.location||"",
        include: true,
      }));
      state.bbMessages=[...state.bbMessages, {role:"assistant", content: data.summary || `I found ${classes.length} class${classes.length>1?"es":""} in that syllabus — check them below and add the ones that look right.`}];
    }
  }catch(err){
    state.bbFileError="Couldn't read or parse that file — try again, or add the class manually.";
  }
  state.bbFileProcessing=false;
  render();
}
function confirmPendingClasses(){
  if(!state.bbPendingClasses) return;
  const toAdd = state.bbPendingClasses.filter(c=>c.include && c.name && c.days.length>0);
  const dayMap={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
  toAdd.forEach((c,i)=>{
    const days = c.days.map(d=>{
      if(typeof d==="number") return d;
      const key=String(d).slice(0,3).toLowerCase();
      return dayMap[key] !== undefined ? dayMap[key] : null;
    }).filter(d=>d!==null);
    if(days.length===0) return;
    state.classes=[...state.classes, {
      id: uid(), name:c.name, days, start:c.start, end:c.end,
      pinId:null, location:c.location||"", color: CLASS_COLORS[i % CLASS_COLORS.length],
    }];
  });
  persist("campus-classes", state.classes);
  state.bbMessages=[...state.bbMessages, {role:"assistant", content:`Added ${toAdd.length} class${toAdd.length!==1?"es":""} to the schedule.`}];
  state.bbPendingClasses=null;
  render();
}

let collegeCalendarId = LS.get("campus-calendar-id", null);
async function calApi(url, options){
  options=options||{};
  options.headers={ ...(options.headers||{}), Authorization:`Bearer ${driveAccessToken}` };
  const res=await fetch(url, options);
  if(res.status===401){ state.driveConnected=false; driveAccessToken=null; throw new Error("Google session expired — reconnect."); }
  return res;
}
async function findOrCreateCollegeCalendar(){
  if(collegeCalendarId){
    const check=await calApi(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(collegeCalendarId)}`);
    if(check.ok) return collegeCalendarId;
  }
  const list=await calApi("https://www.googleapis.com/calendar/v3/users/me/calendarList");
  if(list.ok){
    const data=await list.json();
    const found=(data.items||[]).find(c=>c.summary===COLLEGE_CAL_NAME);
    if(found){ collegeCalendarId=found.id; LS.set("campus-calendar-id", found.id); return found.id; }
  }
  const made=await calApi("https://www.googleapis.com/calendar/v3/calendars",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ summary: COLLEGE_CAL_NAME, description:"Class schedule, due dates and campus events from Campus.", timeZone: CAL_TZ }),
  });
  if(!made.ok) throw new Error("Couldn't create the College calendar.");
  const cal=await made.json();
  collegeCalendarId=cal.id; LS.set("campus-calendar-id", cal.id);
  return cal.id;
}
function courseEndFor(className){
  const short=shortClassName(className).toLowerCase();
  const hit=state.importantDates.find(d=>/course ends/i.test(d.label) &&
    (d.label.toLowerCase().indexOf(short)!==-1 || d.label.toLowerCase().indexOf(courseCodeOf(className).toLowerCase())!==-1));
  return hit?hit.date:null;
}
function nextDateForWeekday(dayIdx){
  const d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() + ((dayIdx - d.getDay() + 7) % 7));
  return d;
}
function isoLocal(dateObj, hhmm){
  const [h,m]=hhmm.split(":");
  const p=n=>String(n).padStart(2,"0");
  return `${dateObj.getFullYear()}-${p(dateObj.getMonth()+1)}-${p(dateObj.getDate())}T${p(h)}:${p(m)}:00`;
}
// Everything Campus knows how to put on a calendar, with a stable key per item.
function calendarPayload(){
  const out=[];
  state.classes.forEach(c=>{
    (c.days||[]).forEach(dayIdx=>{
      const first=nextDateForWeekday(dayIdx);
      const until=courseEndFor(c.name);
      const body={
        summary: shortClassName(c.name),
        location: c.location||"",
        description: c.name,
        start:{ dateTime: isoLocal(first, c.start), timeZone: CAL_TZ },
        end:{ dateTime: isoLocal(first, c.end), timeZone: CAL_TZ },
      };
      if(until) body.recurrence=[`RRULE:FREQ=WEEKLY;UNTIL=${until.replace(/-/g,"")}T235900Z`];
      else body.recurrence=["RRULE:FREQ=WEEKLY;COUNT=16"];
      out.push({key:`class-${c.id}-${dayIdx}`, body});
    });
  });
  state.assignments.filter(a=>!a.done && a.dueDate).forEach(a=>{
    const c=classOfAssignment(a);
    out.push({key:`assign-${a.id}`, body:{
      summary: (c?shortClassName(c.name)+": ":"") + a.title,
      description:"Assignment due",
      start:{ date:a.dueDate }, end:{ date:a.dueDate },
    }});
  });
  state.importantDates.forEach(d=>{
    out.push({key:`date-${d.id}`, body:{ summary:d.label, start:{date:d.date}, end:{date:d.date} }});
  });
  state.events.forEach(e=>{
    if(!e.date) return;
    const body={ summary:e.title, location:e.location||"", description:e.note||"" };
    if(e.time){
      const dt=new Date(e.date+"T12:00:00");
      body.start={ dateTime: isoLocal(dt, e.time), timeZone: CAL_TZ };
      const [h,m]=e.time.split(":");
      body.end={ dateTime: isoLocal(dt, `${String((+h+1)%24).padStart(2,"0")}:${m}`), timeZone: CAL_TZ };
    } else { body.start={date:e.date}; body.end={date:e.date}; }
    out.push({key:`event-${e.id}`, body});
  });
  return out;
}
async function pushToGoogleCalendar(){
  if(!driveAccessToken){ state.calError="Connect Google first — the same connection covers Calendar."; render(); return; }
  state.calPushing=true; state.calError=""; render();
  try{
    const calId=await findOrCreateCollegeCalendar();
    const map=LS.get("campus-calendar-map", {});
    const items=calendarPayload();
    let added=0, updated=0;
    for(const it of items){
      const existing=map[it.key];
      let res=null;
      if(existing){
        res=await calApi(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events/${encodeURIComponent(existing)}`,
          {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(it.body)});
        if(res.ok){ updated++; continue; }
      }
      res=await calApi(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events`,
        {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(it.body)});
      if(res.ok){ const ev=await res.json(); map[it.key]=ev.id; added++; }
    }
    LS.set("campus-calendar-map", map);
    state.calLastPush=new Date().toISOString();
    LS.set("campus-calendar-last-push", state.calLastPush);
    state.calSummary=`${added} added, ${updated} updated`;
  }catch(err){
    state.calError=(err && err.message) ? err.message : "Couldn't reach Google Calendar. Nothing was changed.";
  }
  state.calPushing=false; render();
}

const ASSIGN_PAGE = 3;
function AssignmentRowHTML(a){
  const away=daysUntil(a.dueDate);
  return `<div class="flex items-center gap-2 text-sm py-0.5">
    <button data-action="toggle-assignment" data-id="${a.id}" class="flex-shrink-0">
      <div class="w-4 h-4 rounded-sm flex items-center justify-center" style="border:1px solid var(--accent);background:${a.done?'var(--accent)':'transparent'}">${a.done?'<i data-lucide="check" style="width:11px;height:11px;color:var(--card)"></i>':''}</div>
    </button>
    <span class="flex-1" style="text-decoration:${a.done?'line-through':'none'};color:${a.done?'var(--faint)':'var(--text)'}">${esc(a.title)}</span>
    <span class="text-xs flex-shrink-0" style="color:${!a.done && away<=1?'var(--warn)':'var(--muted)'}">${away===0?"Due today":away===1?"Due tomorrow":away>0?"In "+away+" days":"Was due "+new Date(a.dueDate+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span>
    <button data-action="delete-assignment" data-id="${a.id}"><i data-lucide="x" style="width:12px;height:12px;color:var(--faint2)"></i></button>
  </div>`;
}
function AssignmentGroupsHTML(sorted){
  const groups=[];
  const byId={};
  sorted.forEach(a=>{
    const c=classOfAssignment(a);
    const key=c?c.id:"__other";
    const label=c?shortClassName(c.name):"Other";
    if(!byId[key]){ byId[key]={key,label,color:c?c.color:"var(--faint2)",items:[]}; groups.push(byId[key]); }
    byId[key].items.push(a);
  });
  return `<div class="space-y-2">
    ${groups.map(g=>{
      const open = state.openAssignGroup===g.key;
      const remaining = g.items.filter(a=>!a.done).length;
      const expanded = !!state.expandedGroups[g.key];
      const visible = expanded ? g.items : g.items.slice(0, ASSIGN_PAGE);
      const hidden = g.items.length - visible.length;
      return `<div class="rounded-xl" style="border:1px solid var(--border);border-left:3px solid ${g.color};overflow:hidden">
        <button data-action="toggle-assign-group" data-key="${esc(g.key)}" class="w-full flex items-center gap-2 px-3 py-2.5 text-left">
          <i data-lucide="${open?'chevron-down':'chevron-right'}" style="width:14px;height:14px;color:var(--muted);flex-shrink:0"></i>
          <span class="flex-1 text-sm" style="color:var(--text)">${esc(g.label)}</span>
          <span class="text-xs" style="color:var(--muted)">${remaining} left</span>
        </button>
        ${open?`<div class="px-3 pb-3 space-y-1">
          ${visible.map(AssignmentRowHTML).join("")}
          ${hidden>0?`<button data-action="expand-assign-group" data-key="${esc(g.key)}" class="text-xs mt-1.5 flex items-center gap-1" style="color:var(--accent)"><i data-lucide="plus" style="width:11px;height:11px"></i> Show ${hidden} more</button>`:""}
          ${expanded && g.items.length>ASSIGN_PAGE?`<button data-action="collapse-assign-group" data-key="${esc(g.key)}" class="text-xs mt-1.5 flex items-center gap-1" style="color:var(--muted)"><i data-lucide="minus" style="width:11px;height:11px"></i> Show fewer</button>`:""}
        </div>`:""}
      </div>`;
    }).join("")}
  </div>`;
}

  const items=LS.get(storageKey, []);
  return `<div class="${noBorder?'':'mt-2.5 pt-2.5'}" style="${noBorder?'':'border-top:1px dashed var(--border)'}">
    ${items.length===0?`<p class="text-xs mb-2" style="color:var(--muted)">No items yet — add what people need to know or bring.</p>`:""}
    <div class="space-y-1.5 mb-2">

  return `<div>
    <div class="rounded-xl p-4 mb-4" style="${heroCardStyle()}">
      <div class="flex items-center justify-between mb-1">
        <p class="text-xs uppercase tracking-wide" style="color:var(--muted)">Semester funds</p>
        <button data-action="open-modal" data-modal="semester-setup" class="text-xs" style="color:var(--accent)"><i data-lucide="settings" style="width:13px;height:13px"></i></button>
      </div>
      ${pace?`
        <div class="flex items-baseline gap-1.5 mb-2">
          <span style="font-family:'IBM Plex Mono',monospace;font-weight:600" class="text-xl">${fmtMoney(pace.remaining)}</span>
          <span style="color:var(--muted);font-family:'IBM Plex Mono',monospace" class="text-sm">left of ${fmtMoney(state.semester.total)}</span>
        </div>
        ${RulerBarHTML(Math.min(100,Math.max(0,((state.semester.total-pace.remaining)/state.semester.total)*100)), pace.status)}
        <p class="text-xs mt-2" style="color:var(--muted)">~${fmtMoney(pace.weeklyAllowance)}/week keeps you on pace to the end of the semester.</p>
      `:`<p class="text-sm" style="color:var(--muted)">Got a lump sum — financial aid, a parent transfer? Set it up once and see a weekly pace instead of one big scary number.</p>`}
    </div>

    <div class="flex items-center justify-between mb-3">
      <h2 style="font-family:'Fraunces',serif;font-weight:600" class="text-lg">Weekly categories</h2>
      <button data-action="open-modal" data-modal="add-category" class="flex items-center gap-1 text-sm px-2.5 py-1.5 rounded-xl" style="${primaryBtn()}"><i data-lucide="plus" style="width:14px;height:14px"></i> Category</button>
    </div>
    <div class="space-y-3">
      ${state.budgetCats.map(cat=>{
        const spent=spentFor(cat.id), pct=(spent/cat.weeklyLimit)*100, status=statusFor(pct);
        const isExp=state.expandedBudgetCat===cat.id;
        const catTx=state.budgetTx.filter(t=>t.categoryId===cat.id).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,8);
        return `<div class="rounded-xl p-4" style="${cardStyle()}">
          <div class="flex items-center justify-between mb-1">
            <div class="flex items-center gap-2">
              <span style="font-family:'Fraunces',serif;font-weight:600">${esc(cat.name)}</span>
              ${cat.discretionary?`<span class="text-[10px] px-1.5 py-0.5 rounded-full uppercase" style="background:var(--chip);color:var(--muted)">Discretionary</span>`:""}
            </div>
            <button data-action="delete-category" data-id="${cat.id}"><i data-lucide="trash-2" style="width:14px;height:14px;color:var(--faint2)"></i></button>
          </div>
          <div class="flex items-baseline gap-1.5 mb-2">
            <span style="font-family:'IBM Plex Mono',monospace;font-weight:600" class="text-lg">${fmtMoney(spent)}</span>
            <span style="color:var(--muted);font-family:'IBM Plex Mono',monospace" class="text-xs">of ${fmtMoney(cat.weeklyLimit)}</span>
          </div>
          ${RulerBarHTML(pct,status)}
          <div class="flex items-center justify-between mt-2">
            <button data-action="toggle-budget-cat" data-id="${cat.id}" class="flex items-center gap-1 text-xs" style="color:var(--muted)">${catTx.length} recent <i data-lucide="${isExp?'chevron-up':'chevron-down'}" style="width:13px;height:13px"></i></button>
            <button data-action="open-modal" data-modal="add-tx" data-catid="${cat.id}" class="flex items-center gap-1 text-xs px-2 py-1 rounded-xl" style="border:1px solid var(--accent);color:var(--accent)"><i data-lucide="plus" style="width:12px;height:12px"></i> Add expense</button>
          </div>
          ${isExp?`<div class="mt-3 pt-3 space-y-1.5" style="border-top:1px dashed var(--border)">
            ${catTx.length===0?`<p class="text-xs" style="color:var(--muted)">No expenses yet.</p>`:""}
            ${catTx.map(t=>`<div class="flex items-center justify-between text-sm">
              <span><span style="font-family:'IBM Plex Mono',monospace">${fmtMoney(t.amount)}</span>${t.note?` — ${esc(t.note)}`:""}</span>
              <button data-action="delete-tx" data-id="${t.id}"><i data-lucide="x" style="width:12px;height:12px;color:var(--faint2)"></i></button>
            </div>`).join("")}
          </div>`:""}
        </div>`;
      }).join("")}
    </div>

    <div class="flex items-center justify-between mt-6 mb-3">
      <h2 style="font-family:'Fraunces',serif;font-weight:600" class="text-lg flex items-center gap-1.5"><i data-lucide="refresh-cw" style="width:16px;height:16px"></i> Subscriptions</h2>
      <button data-action="open-modal" data-modal="add-sub" class="flex items-center gap-1 text-sm px-2.5 py-1.5 rounded-xl" style="${primaryBtn()}"><i data-lucide="plus" style="width:14px;height:14px"></i> Add</button>
    </div>
    ${state.subscriptions.length===0?`<p class="text-sm" style="color:var(--muted)">Add streaming, software, or other recurring charges — you'll get a heads-up a few days before each renews.</p>`:`
      <p class="text-xs mb-2" style="color:var(--muted)">${fmtMoney(totalMonthlySubs)}/month across ${state.subscriptions.length} subscription${state.subscriptions.length>1?"s":""}</p>
      <div class="space-y-2">${state.subscriptions.map(sub=>{const nd=nextRenewalDate(sub), away=daysUntil(nd); return `<div class="flex items-center justify-between p-3 rounded-xl" style="${cardStyle()}">
        <div><p class="text-sm font-medium">${esc(sub.name)}</p><p class="text-xs" style="color:var(--muted)">${fmtMoney(sub.amount)}/${sub.cadence} · renews in ${away}d</p></div>
        <button data-action="delete-sub" data-id="${sub.id}"><i data-lucide="trash-2" style="width:14px;height:14px;color:var(--faint2)"></i></button>
      </div>`;}).join("")}</div>
    `}

    <div class="flex items-center justify-between mt-6 mb-3">
      <h2 style="font-family:'Fraunces',serif;font-weight:600" class="text-lg flex items-center gap-1.5"><i data-lucide="users" style="width:16px;height:16px"></i> Split with roommates</h2>
      <button data-action="open-modal" data-modal="add-split" class="flex items-center gap-1 text-sm px-2.5 py-1.5 rounded-xl" style="${primaryBtn()}"><i data-lucide="plus" style="width:14px;height:14px"></i> Add</button>
    </div>
    ${Object.keys(balances).length===0?`<p class="text-sm" style="color:var(--muted)">Log a shared cost — utilities, groceries, an Uber — and keep track of who owes who.</p>`:`
      <div class="space-y-2">${Object.entries(balances).map(([person,bal])=>`<div class="flex items-center justify-between p-3 rounded-xl" style="${cardStyle()}">
        <span class="text-sm font-medium">${esc(person)}</span>
        <div class="flex items-center gap-2">
          <span class="text-sm" style="font-family:'IBM Plex Mono',monospace;color:${bal>=0?'var(--ok)':'var(--over)'}">${bal>=0?`owes you ${fmtMoney(bal)}`:`you owe ${fmtMoney(bal)}`}</span>
          <button data-action="settle-split" data-person="${esc(person)}" class="text-xs px-2 py-1 rounded-xl" style="border:1px solid var(--border);color:var(--muted)">Settle</button>
        </div>
      </div>`).join("")}</div>
    `}
  </div>`;
}

function MapLegendHTML(){
  const open=state.legendOpen;
  return `<div class="rounded-xl mt-3" style="${cardStyle()}">
    <button data-action="toggle-legend" class="w-full flex items-center gap-2 px-3.5 py-2.5 text-left">
      <i data-lucide="${open?'chevron-down':'chevron-right'}" style="width:14px;height:14px;color:var(--muted);flex-shrink:0"></i>
      <span class="flex-1 text-sm" style="color:var(--text)">Building legend</span>
      <span class="text-xs" style="color:var(--muted)">${NL_BUILDINGS.length} buildings</span>
    </button>
    ${open?`<div class="px-3.5 pb-3.5 space-y-2">
      ${NL_BUILDINGS.map(b=>`<div class="flex gap-2.5 items-start">
        <span class="flex-shrink-0 rounded-md text-xs font-medium flex items-center justify-center" style="width:22px;height:22px;background:var(--accent);color:var(--card)">${b.k}</span>
        <span class="text-xs leading-relaxed pt-0.5" style="color:var(--muted)">${esc(b.d)}</span>
      </div>`).join("")}
      <p class="text-xs pt-1.5 leading-relaxed" style="color:var(--faint);border-top:1px solid var(--border)">Service rooms come from Dallas College's published North Lake campus map. Buildings listed only as classrooms don't have a published name \u2014 edit this list as she learns what's in them.</p>
    </div>`:""}
  </div>`;
}
function MapTabHTML(){
  return `<div>
    <div class="flex items-center justify-between mb-3">
      <h2 style="font-family:'Fraunces',serif;font-weight:600" class="text-lg">Campus map</h2>
      <button data-action="toggle-map-add" class="flex items-center gap-1 text-sm px-2.5 py-1.5 rounded-xl" style="background:${state.mapAddMode?'var(--warn)':'var(--accent)'};color:white">
        <i data-lucide="plus" style="width:14px;height:14px"></i> ${state.mapAddMode?"Tap the map…":"Pin"}
      </button>
    </div>
    <svg id="campus-map-svg" viewBox="0 0 100 63.6" class="w-full rounded-xl" style="background:var(--chip);cursor:${state.mapAddMode?'crosshair':'default'};border:1px solid var(--border)">
      <image href="${NL_MAP_SRC}" x="18.2" y="0" width="63.6" height="63.6" preserveAspectRatio="xMidYMid meet"/>
      ${state.pins.map(p=>`<g><circle cx="${p.x}" cy="${p.y*0.636}" r="1.6" fill="var(--accent)" stroke="white" stroke-width="0.4"/><text x="${p.x}" y="${p.y*0.636-2.5}" font-size="3" text-anchor="middle" fill="var(--text)" font-family="Inter, sans-serif">${esc(p.name)}</text></g>`).join("")}
    </svg>
    ${MapLegendHTML()}
    <p class="text-xs mt-2" style="color:var(--muted)">Tap "Pin" then tap the map to mark a building. Walk-time warnings on your schedule use these pins.</p>
    <div class="mt-4 space-y-2">
      ${state.pins.map(p=>`<div class="flex items-center justify-between p-2.5 rounded-xl" style="${cardStyle()}">
        <span class="flex items-center gap-1.5 text-sm"><i data-lucide="map-pin" style="width:13px;height:13px;color:var(--accent)"></i> ${esc(p.name)}</span>
        <button data-action="delete-pin" data-id="${p.id}"><i data-lucide="trash-2" style="width:14px;height:14px;color:var(--faint2)"></i></button>
      </div>`).join("")}
    </div>
  </div>`;
}


/* ------------------------------- Classes Tab ----------------------------- */
function datesForClass(name){
  const short=shortClassName(name).toLowerCase();
  const code=courseCodeOf(name).toLowerCase();
  return state.importantDates.filter(d=>{
    const l=(d.label||"").toLowerCase();
    return (short && l.indexOf(short)!==-1) || (code && l.indexOf(code)!==-1);
  }).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function ClassDetailHTML(c, isAsync){
  const open=state.openClassCard===c.id;
  const ck=LS.get(classChecklistKey(c.name), []);
  const assigns=state.assignments.filter(a=>{
    const k=classOfAssignment(a); return k && k.id===c.id;
  }).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  const dates=datesForClass(c.name);
  const left=assigns.filter(a=>!a.done).length;
  const meets = isAsync ? "Self-paced \u2014 no set meeting time"
    : `${(c.days||[]).map(d=>DAY_LABELS[d]).join(", ")} \u00b7 ${fmtTime(c.start)}\u2013${fmtTime(c.end)}`;
  return `<div class="rounded-xl mb-2.5" style="${cardStyle()}${isAsync?"":`border-left:4px solid ${c.color||"var(--accent)"}`}">
    <button data-action="toggle-class-card" data-id="${c.id}" class="w-full flex items-start gap-2.5 px-4 py-3.5 text-left">
      <i data-lucide="${open?'chevron-down':'chevron-right'}" style="width:14px;height:14px;color:var(--muted);flex-shrink:0;margin-top:3px"></i>
      <div class="flex-1">
        <p style="font-family:'Fraunces',serif;font-weight:600;color:var(--text)">${esc(shortClassName(c.name))}</p>
        <p class="text-xs mt-0.5" style="color:var(--muted)">${esc(meets)}</p>
      </div>
      <span class="text-xs flex-shrink-0 pt-1" style="color:var(--muted)">${left} left</span>
    </button>
    ${open?`<div class="px-4 pb-4 pt-1">
      ${c.location?`<p class="text-xs mb-2.5 flex items-start gap-1.5" style="color:var(--muted)"><i data-lucide="map-pin" style="width:12px;height:12px;margin-top:2px;flex-shrink:0"></i> ${esc(c.location)}</p>`:""}
      ${isAsync?`<div class="text-xs space-y-1 mb-2.5" style="color:var(--muted)">
        ${c.instructor?`<p>${esc(c.instructor)}</p>`:""}
        ${c.officeHours?`<p>Office hours: ${esc(c.officeHours)}</p>`:""}
        ${c.textbook?`<p>${esc(c.textbook)}</p>`:""}
      </div>`:""}

      ${ck.length?`<p class="text-xs uppercase tracking-wide mb-1.5 mt-1" style="color:var(--faint)">Course info</p>
      <div class="space-y-1 mb-3">
        ${ck.map(i=>`<p class="text-xs leading-relaxed" style="color:var(--muted)">\u00b7 ${esc(i.text)}</p>`).join("")}
      </div>`:""}

      ${dates.length?`<p class="text-xs uppercase tracking-wide mb-1.5" style="color:var(--faint)">Semester dates</p>
      <div class="space-y-1 mb-3">
        ${dates.map(d=>`<div class="flex items-baseline gap-2 text-xs">
          <span class="flex-shrink-0" style="color:var(--muted);min-width:52px">${new Date(d.date+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span>
          <span style="color:var(--text)">${esc(d.label.replace(/^.*?\u2014\s*/,""))}</span>
        </div>`).join("")}
      </div>`:""}

      ${assigns.length?(()=>{
        const showAll=!!state.classShowAll[c.id];
        const shown=showAll?assigns:assigns.slice(0,3);
        const rest=assigns.length-shown.length;
        return `<p class="text-xs uppercase tracking-wide mb-1.5" style="color:var(--faint)">Work in this class</p>
      <div class="space-y-2">
        ${shown.map(a=>{
          const away=daysUntil(a.dueDate);
          return `<div class="flex items-center gap-2 text-xs">
            <button data-action="toggle-assignment" data-id="${a.id}" class="flex-shrink-0">
              <div class="rounded-sm flex items-center justify-center" style="width:14px;height:14px;border:1px solid var(--accent);background:${a.done?'var(--accent)':'transparent'}">${a.done?'<i data-lucide="check" style="width:9px;height:9px;color:var(--card)"></i>':''}</div>
            </button>
            <span class="flex-shrink-0" style="color:var(--muted);min-width:52px">${new Date(a.dueDate+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span>
            <span class="flex-1 leading-relaxed" style="text-decoration:${a.done?'line-through':'none'};color:${a.done?'var(--faint)':'var(--text)'}">${esc(a.title)}</span>
            ${!a.done&&away>=0&&away<=2?`<span class="flex-shrink-0" style="color:var(--warn)">${away===0?"today":away===1?"tomorrow":away+" days"}</span>`:""}
          </div>`;
        }).join("")}
      </div>
      ${rest>0?`<button data-action="class-show-all" data-id="${c.id}" class="text-xs mt-2.5 flex items-center gap-1.5" style="color:var(--accent)"><i data-lucide="plus" style="width:12px;height:12px"></i> Show the other ${rest}</button>`:""}
      ${showAll&&assigns.length>3?`<button data-action="class-show-less" data-id="${c.id}" class="text-xs mt-2.5 flex items-center gap-1.5" style="color:var(--muted)"><i data-lucide="minus" style="width:12px;height:12px"></i> Show only the next 3</button>`:""}`;
      })():`<p class="text-xs" style="color:var(--muted)">No assignments recorded for this class yet.</p>`}
    </div>`:""}
  </div>`;
}
function ClassesTabHTML(){
  const has=state.classes.length+state.asyncCourses.length;
  return `<div>
    <h2 style="font-family:'Fraunces',serif;font-weight:600" class="text-lg mb-1">Classes</h2>
    <p class="text-xs mb-3" style="color:var(--muted)">Everything for the whole semester, one class at a time.</p>
    ${has===0?`<p class="text-sm" style="color:var(--muted)">No classes yet. Add them from the Schedule tab.</p>`:""}
    ${state.classes.map(c=>ClassDetailHTML(c,false)).join("")}
    ${state.asyncCourses.map(c=>ClassDetailHTML(c,true)).join("")}
  </div>`;
}

}

/* ------------------------------ main render ------------------------------ */
function AppHTML(){
  if(!state.enrollment) return EnrollmentGateHTML();
  let tabHtml="";
  if(state.tab==="today") tabHtml=TodayTabHTML();
  else if(state.tab==="classes") tabHtml=ClassesTabHTML();
  else if(state.tab==="schedule") tabHtml=ScheduleTabHTML();
  else if(state.tab==="budget") tabHtml=BudgetTabHTML();
  else if(state.tab==="map") tabHtml = isVerified()?MapTabHTML():LockedFeatureHTML("the campus map");
  else if(state.tab==="events") tabHtml = isVerified()?EventsTabHTML():LockedFeatureHTML("campus events");

  return `<div style="min-height:100vh" class="pb-24">
    ${HeaderHTML()}
    ${BannersHTML()}
    <div class="fade-in max-w-md mx-auto px-5 pt-4">${tabHtml}</div>
    ${BottomNavHTML()}
    ${BlueBonnetFabHTML()}
    ${state.showBlueBonnet?BlueBonnetModalHTML():""}
    ${ModalsHTML()}

let __lastHTML=null;
function render(){
  document.documentElement.setAttribute("data-theme", state.theme||"warm");
  const html=AppHTML();
  if(html===__lastHTML) return;   // nothing visible changed — don't touch the DOM
  __lastHTML=html;
  document.getElementById("app").innerHTML = html;
  if(window.lucide) lucide.createIcons();
  const bbScroll=document.getElementById("bb-scroll");
  if(bbScroll) bbScroll.scrollTop=bbScroll.scrollHeight;
}

/* ------------------------------ event handling ---------------------------- */
window.__addEnrollItem=function(){
  const inp=document.getElementById("enroll-item-input");
  if(!inp || !inp.value.trim()) return;
  state.enrollChecklist=[...state.enrollChecklist, {id:uid(), text:inp.value.trim(), done:false}];
  persist("campus-enrollment-checklist", state.enrollChecklist);
  render();
};
window.__addChecklistItem=function(key){
  const inp=document.getElementById("ck-input-"+btoa(key).replace(/=/g,""));
  if(!inp || !inp.value.trim()) return;
  const items=LS.get(key, []);
  items.push({id:uid(), text:inp.value.trim(), done:false});
  persist(key, items);
  render();
};
window.__handleIdPhoto=function(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(){
    const img=new Image();
    img.onload=function(){
      const maxSize=320, scale=Math.min(1, maxSize/Math.max(img.width,img.height));
      const canvas=document.createElement("canvas");
      canvas.width=img.width*scale; canvas.height=img.height*scale;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      state.draftProfile = state.draftProfile || {...state.profile};
      state.draftProfile.photo = canvas.toDataURL("image/jpeg", 0.85);
      render();
    };
    img.onerror=function(){ const el=document.getElementById("id-photo-error"); if(el) el.textContent="Couldn't process that photo — try a different one."; };
    img.src=reader.result;
  };
  reader.onerror=function(){ const el=document.getElementById("id-photo-error"); if(el) el.textContent="Couldn't read that file."; };
  reader.readAsDataURL(file);
};
window.__idFieldChanged=function(){
  state.draftProfile = state.draftProfile || {...state.profile};
  state.draftProfile.name = document.getElementById("id-name").value;
  state.draftProfile.school = document.getElementById("id-school").value;
  state.draftProfile.studentId = document.getElementById("id-studentid").value;
};
window.__sendBB=function(){ sendBlueBonnet(); };
window.__bbFileSelected=function(e){
  const file=e.target.files[0];
  if(file) handleSyllabusFile(file);
  e.target.value="";
};

document.addEventListener("dragover", function(e){
  const panel=document.getElementById("bb-panel");
  if(!panel || !panel.contains(e.target)) return;
  e.preventDefault();
  if(!state.bbDragOver){ state.bbDragOver=true; render(); }
});
document.addEventListener("dragleave", function(e){
  const panel=document.getElementById("bb-panel");
  if(!panel) return;
  if(e.target===panel || !panel.contains(e.relatedTarget)){
    if(state.bbDragOver){ state.bbDragOver=false; render(); }
  }
});
document.addEventListener("drop", function(e){
  const panel=document.getElementById("bb-panel");
  if(!panel || !panel.contains(e.target)) return;
  e.preventDefault();
  state.bbDragOver=false;
  const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(file) handleSyllabusFile(file);
  else render();
});

document.addEventListener("click", function(e){
  const modalBg = e.target.closest('[data-action="close-modal"]');
  const stopArea = e.target.closest('[data-stop]');
  if(modalBg && !stopArea){ state.modal=null; render(); return; }
  const bbBg = e.target.closest('[data-action="close-bluebonnet"]');
  if(bbBg && !stopArea){ state.showBlueBonnet=false; render(); return; }

  const t = e.target.closest("[data-action]");
  if(!t) return;
  const action=t.dataset.action;

  switch(action){
    case "set-tab": state.tab=t.dataset.tab; render(); break;
    case "dismiss-banner": state.dismissed=[...state.dismissed, t.dataset.id]; render(); break;
    case "open-feed": state.modal={type:"feed"}; render(); break;
    case "open-id": state.draftProfile={...state.profile}; state.modal={type:"id"}; render(); break;
    case "close-modal": state.modal=null; render(); break;
    case "open-bluebonnet": state.showBlueBonnet=true; render(); break;
    case "gate-submit": gateSubmit(); break;
    case "gate-pending": gatePending(); break;
    case "lock-verify": lockVerify(); break;

    case "toggle-enroll-checklist": state.enrollChecklistOpen = !(state.enrollChecklistOpen===null?!isVerified():state.enrollChecklistOpen); render(); break;
    case "toggle-enroll-item": {
      const id=t.dataset.id;
      state.enrollChecklist=state.enrollChecklist.map(x=>x.id===id?{...x,done:!x.done}:x);
      persist("campus-enrollment-checklist", state.enrollChecklist); render(); break;
    }
    case "delete-enroll-item": {
      state.enrollChecklist=state.enrollChecklist.filter(x=>x.id!==t.dataset.id);
      persist("campus-enrollment-checklist", state.enrollChecklist); render(); break;
    }
    case "add-enroll-item": window.__addEnrollItem(); break;

    case "toggle-safety": state.safetyOpen=!state.safetyOpen; render(); break;
    case "edit-safety": state.safetyEditing=true; state.safetyOpen=true; render(); break;
    case "save-safety": {
      state.safetyInfo={ safetyNumber:document.getElementById("safety-num").value, escortNumber:document.getElementById("escort-num").value };
      persist("campus-safety-info", state.safetyInfo);
      state.safetyEditing=false; render(); break;
    }
    case "toggle-support": state.supportOpen=!state.supportOpen; render(); break;
    case "edit-support": state.supportEditing=true; state.supportOpen=true; render(); break;
    case "save-support": {
      state.supportInfo={ center:document.getElementById("support-center").value, number:document.getElementById("support-number").value };
      persist("campus-support-info", state.supportInfo);
      state.supportEditing=false; render(); break;
    }

    case "set-schedule-day": state.scheduleDay=Number(t.dataset.day); render(); break;
    case "toggle-class-checklist": state.openChecklist = state.openChecklist===t.dataset.id?null:t.dataset.id; render(); break;
    case "delete-class": state.classes=state.classes.filter(c=>c.id!==t.dataset.id); persist("campus-classes", state.classes); render(); break;
    case "toggle-async-checklist": { const key="async-"+t.dataset.id; state.openChecklist = state.openChecklist===key?null:key; render(); break; }
    case "delete-async": state.asyncCourses=state.asyncCourses.filter(a=>a.id!==t.dataset.id); persist("campus-async-courses", state.asyncCourses); render(); break;
    case "submit-add-async": {
      const name=document.getElementById("ac-name").value.trim();
      if(!name) return;
      const instructor=document.getElementById("ac-instructor").value.trim();
      const officeHours=document.getElementById("ac-office").value.trim();
      const textbook=document.getElementById("ac-textbook").value.trim();
      state.asyncCourses=[...state.asyncCourses, { id:uid(), name, instructor, officeHours, textbook }];
      persist("campus-async-courses", state.asyncCourses);
      state.modal=null; render(); break;
    }
    case "delete-date": state.importantDates=state.importantDates.filter(d=>d.id!==t.dataset.id); persist("campus-dates", state.importantDates); render(); break;
    case "toggle-assignment": {
      const id=t.dataset.id;
      state.assignments=state.assignments.map(a=>a.id===id?{...a,done:!a.done}:a);
      persist("campus-assignments", state.assignments); render(); break;
    }
    case "push-calendar": pushToGoogleCalendar(); break;
    case "class-show-all": state.classShowAll={...state.classShowAll,[t.dataset.id]:true}; render(); break;
    case "class-show-less": state.classShowAll={...state.classShowAll,[t.dataset.id]:false}; render(); break;
    case "toggle-class-card": { const k=t.dataset.id; state.openClassCard = state.openClassCard===k?null:k; render(); break; }
    case "toggle-dfw": state.dfwOpen=!state.dfwOpen; render(); break;
    case "add-dfw-event": {
      const src=DFW_LEGAL_EVENTS.find(x=>x.id===t.dataset.id);
      if(src && !state.events.some(e=>e.sourceId===src.id)){
        state.events=[...state.events,{id:uid(), sourceId:src.id, title:src.title, date:src.date, time:src.time, location:src.location, note:src.note}];
        persist("campus-events", state.events);
      }
      render(); break;
    }
    case "toggle-legend": state.legendOpen=!state.legendOpen; render(); break;
    case "toggle-assign-group": {
      const k=t.dataset.key;
      state.openAssignGroup = state.openAssignGroup===k ? null : k;
      render(); break;
    }
    case "expand-assign-group": state.expandedGroups={...state.expandedGroups,[t.dataset.key]:true}; render(); break;
    case "collapse-assign-group": state.expandedGroups={...state.expandedGroups,[t.dataset.key]:false}; render(); break;
    case "delete-assignment": state.assignments=state.assignments.filter(a=>a.id!==t.dataset.id); persist("campus-assignments", state.assignments); render(); break;

    case "toggle-checklist-item": {
      const key=t.dataset.key, id=t.dataset.id;
      const items=LS.get(key, []).map(x=>x.id===id?{...x,done:!x.done}:x);
      persist(key, items); render(); break;
    }
    case "delete-checklist-item": {
      const key=t.dataset.key, id=t.dataset.id;
      const items=LS.get(key, []).filter(x=>x.id!==id);
      persist(key, items); render(); break;
    }
    case "add-checklist-item": window.__addChecklistItem(t.dataset.key); break;

    case "open-modal": {
      const type=t.dataset.modal;
      if(type==="add-class") state.draftClass={days:[], color:CLASS_COLORS[0]};
      if(type==="add-split") state.draftSplitOwe=false;
      state.modal={type, catId:t.dataset.catid};
      render(); break;
    }
    case "toggle-class-day": {
      const d=Number(t.dataset.day);
      const draft=state.draftClass||{days:[],color:CLASS_COLORS[0]};
      draft.days = draft.days.includes(d)? draft.days.filter(x=>x!==d) : [...draft.days, d];
      state.draftClass=draft; render(); break;
    }
    case "set-class-color": {
      const draft=state.draftClass||{days:[],color:CLASS_COLORS[0]};
      draft.color=t.dataset.color; state.draftClass=draft; render(); break;
    }
    case "submit-add-class": {
      const name=document.getElementById("cl-name").value.trim();
      const start=document.getElementById("cl-start").value;
      const end=document.getElementById("cl-end").value;
      const pinId=document.getElementById("cl-pin").value;
      const draft=state.draftClass||{days:[],color:CLASS_COLORS[0]};
      if(!name || draft.days.length===0) return;
      const pin=state.pins.find(p=>p.id===pinId);
      state.classes=[...state.classes, {id:uid(), name, days:draft.days, start, end, pinId:pinId||null, location:pin?pin.name:"", color:draft.color}];
      persist("campus-classes", state.classes);
      state.modal=null; state.draftClass=null; render(); break;
    }
    case "submit-add-date": {
      const label=document.getElementById("md-label").value.trim();
      const date=document.getElementById("md-date").value;
      if(!label) return;
      state.importantDates=[...state.importantDates, {id:uid(), label, date}];
      persist("campus-dates", state.importantDates);
      state.modal=null; render(); break;
    }
    case "submit-add-assignment": {
      const title=document.getElementById("ma-title").value.trim();
      const dueDate=document.getElementById("ma-due").value;
      if(!title) return;
      state.assignments=[...state.assignments, {id:uid(), title, dueDate, done:false}];
      persist("campus-assignments", state.assignments);
      state.modal=null; render(); break;
    }

    case "toggle-budget-cat": state.expandedBudgetCat = state.expandedBudgetCat===t.dataset.id?null:t.dataset.id; render(); break;
    case "delete-category": {
      state.budgetCats=state.budgetCats.filter(c=>c.id!==t.dataset.id);
      persist("campus-budget-cats", state.budgetCats); render(); break;
    }
    case "submit-add-category": {
      const name=document.getElementById("mc-name").value.trim();
      const limit=parseFloat(document.getElementById("mc-limit").value);
      const disc=document.getElementById("mc-disc").checked;
      if(!name || !limit || limit<=0) return;
      state.budgetCats=[...state.budgetCats, {id:uid(), name, weeklyLimit:limit, discretionary:disc}];
      persist("campus-budget-cats", state.budgetCats);
      state.modal=null; render(); break;
    }
    case "delete-tx": state.budgetTx=state.budgetTx.filter(t2=>t2.id!==t.dataset.id); persist("campus-budget-tx", state.budgetTx); render(); break;
    case "submit-add-tx": {
      const catId=t.dataset.catid;
      const amount=parseFloat(document.getElementById("mt-amount").value);
      const note=document.getElementById("mt-note").value;
      const cat=state.budgetCats.find(c=>c.id===catId);
      if(!cat || !amount || amount<=0) return;
      const ws=startOfWeek(new Date()), we=endOfWeek(new Date());
      const prevSpent=state.budgetTx.filter(tx=>tx.categoryId===catId).filter(tx=>{const d=new Date(tx.date); return d>=ws&&d<=we;}).reduce((s,tx)=>s+tx.amount,0);
      state.budgetTx=[...state.budgetTx, {id:uid(), categoryId:catId, amount, note:note||"", date:new Date().toISOString()}];
      persist("campus-budget-tx", state.budgetTx);
      const newSpent=prevSpent+amount, prevPct=(prevSpent/cat.weeklyLimit)*100, newPct=(newSpent/cat.weeklyLimit)*100;
      if(prevPct<100 && newPct>=100) pushAlert(`budget-over-${cat.id}-${Date.now()}`, `${cat.name} hit its weekly limit of ${fmtMoney(cat.weeklyLimit)}.`, "over");
      else if(prevPct<75 && newPct>=75) pushAlert(`budget-warn-${cat.id}-${Date.now()}`, `${cat.name} is at ${Math.round(newPct)}% of its weekly limit.`, "warn");
      state.modal=null; render(); break;
    }
    case "submit-semester": {
      const total=parseFloat(document.getElementById("ss-total").value);
      const startDate=document.getElementById("ss-start").value;
      const endDate=document.getElementById("ss-end").value;
      if(!total || total<=0 || !endDate) return;
      state.semester={total, startDate, endDate};
      persist("campus-semester", state.semester);
      state.modal=null; render(); break;
    }
    case "clear-semester": state.semester=null; persist("campus-semester", null); state.modal=null; render(); break;
    case "delete-sub": state.subscriptions=state.subscriptions.filter(s=>s.id!==t.dataset.id); persist("campus-subscriptions", state.subscriptions); render(); break;
    case "submit-add-sub": {
      const name=document.getElementById("ms-name").value.trim();
      const amount=parseFloat(document.getElementById("ms-amount").value);
      const cadence=document.getElementById("ms-cadence").value;
      const renewsOn=document.getElementById("ms-renews").value;
      if(!name || !amount || amount<=0) return;
      state.subscriptions=[...state.subscriptions, {id:uid(), name, amount, cadence, renewsOn}];
      persist("campus-subscriptions", state.subscriptions);
      state.modal=null; render(); break;
    }
    case "settle-split": {
      const person=t.dataset.person;
      state.splits=state.splits.map(s=>s.person===person?{...s,settled:true}:s);
      persist("campus-splits", state.splits); render(); break;
    }
    case "set-split-direction": {
      state.draftSplitOwe = t.dataset.owe==="true";
      const theyBtn=document.getElementById("msp-btn-they"), iBtn=document.getElementById("msp-btn-i");
      if(theyBtn && iBtn){
        theyBtn.style.background = state.draftSplitOwe? "white":"var(--accent)"; theyBtn.style.color = state.draftSplitOwe? "var(--text)":"white";
        iBtn.style.background = state.draftSplitOwe? "var(--accent)":"white"; iBtn.style.color = state.draftSplitOwe? "white":"var(--text)";
      }
      break;
    }
    case "submit-add-split": {
      const description=document.getElementById("msp-desc").value.trim();
      const amount=parseFloat(document.getElementById("msp-amount").value);
      const person=document.getElementById("msp-person").value.trim();
      if(!description || !amount || amount<=0 || !person) return;
      state.splits=[...state.splits, {id:uid(), description, amount, person, iOwe:!!state.draftSplitOwe, settled:false, date:new Date().toISOString()}];
      persist("campus-splits", state.splits);
      state.modal=null; render(); break;
    }
    case "delete-event": state.events=state.events.filter(ev=>ev.id!==t.dataset.id); persist("campus-events", state.events); render(); break;
    case "submit-add-event": {
      const title=document.getElementById("me-title").value.trim();
      const date=document.getElementById("me-date").value;
      const time=document.getElementById("me-time").value;
      const pinId=document.getElementById("me-pin").value;
      const note=document.getElementById("me-note").value;
      if(!title) return;
      const pin=state.pins.find(p=>p.id===pinId);
      state.events=[...state.events, {id:uid(), title, date, time, pinId:pinId||null, location:pin?pin.name:"", note}];
      persist("campus-events", state.events);
      state.modal=null; render(); break;
    }

    case "toggle-map-add": state.mapAddMode=!state.mapAddMode; render(); break;
    case "delete-pin": state.pins=state.pins.filter(p=>p.id!==t.dataset.id); persist("campus-pins", state.pins); render(); break;
    case "submit-name-pin": {
      const name=document.getElementById("mp-name").value.trim();
      if(!name || !state.pendingPin) return;
      state.pins=[...state.pins, {id:uid(), name, x:state.pendingPin.x, y:state.pendingPin.y}];
      persist("campus-pins", state.pins);
      state.pendingPin=null; state.modal=null; render(); break;
    }

    case "trigger-photo": document.getElementById("id-photo-file").click(); break;
    case "save-id": {
      const dp=state.draftProfile||state.profile;
      state.profile={ ...state.profile, name:dp.name||"", school:dp.school||"", studentId:dp.studentId||"", photo:dp.photo||state.profile.photo||"" };
      persist("campus-profile", state.profile);
      state.draftProfile=null; state.modal=null; render(); break;
    }
    case "sign-out": state.enrollment=null; persist("campus-enrollment", null); state.modal=null; render(); break;

    case "send-bluebonnet": sendBlueBonnet(); break;
    case "connect-drive": connectDrive(); break;
    case "set-theme": state.theme=t.dataset.theme; persist("campus-theme", state.theme); render(); break;
    case "sync-now": saveToDrive(); break;
    case "run-syllabus-import": runSyllabusImport(); break;
    case "trigger-bb-file": document.getElementById("bb-file-input").click(); break;
    case "toggle-pending-class": {
      const idx=Number(t.dataset.idx);
      if(state.bbPendingClasses && state.bbPendingClasses[idx]) state.bbPendingClasses[idx].include = t.checked;
      break;
    }
    case "confirm-pending-classes": confirmPendingClasses(); break;
    case "cancel-pending-classes": state.bbPendingClasses=null; render(); break;
  }
});

document.addEventListener("click", function(e){
  const svg=document.getElementById("campus-map-svg");
  if(!svg || !state.mapAddMode) return;
  if(e.target!==svg && e.target.closest("svg")!==svg) return;
  if(e.target.closest("[data-action]")) return;
  const rect=svg.getBoundingClientRect();
  const x=((e.clientX-rect.left)/rect.width)*100;
  const y=((e.clientY-rect.top)/rect.height)*100;
  state.pendingPin={x,y};
  state.mapAddMode=false;
  state.modal={type:"name-pin"};
  render();
});

// Migrate older assignments: strip the course code and attach a classId.
(function migrateAssignments(){
  let touched=false;
  state.assignments = state.assignments.map(a=>{
    const cleaned = cleanAssignmentTitle(a.title);
    let classId = a.classId;
    if(!classId){ const c = classOfAssignment(a); if(c) classId = c.id; }
    if(cleaned!==a.title || classId!==a.classId){ touched=true; return {...a, title:cleaned, classId}; }
    return a;
  });
  if(touched) persist("campus-assignments", state.assignments);
})();

/* --------------------------------- boot ----------------------------------- */
// Fall 2026 syllabi ship with the app: load them automatically on first open,
// on every device, with no tap required.
if(!LS.get("campus-syllabus-import-done", false)){
  try{ runSyllabusImport(); }catch(e){}
}
render();
alertsChanged=false;
runChecks();
setInterval(runChecks, 30000);
initGoogleClient();
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
